<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Assessment Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="site-header"><a href="{{ url_for('index') }}" class="brand">Assessment Lab</a><span class="badge">Pilot research demo</span></header>
  <main class="container">
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Educational/research exploration only — not a clinical or medical diagnosis.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
